[project]
name = "taxifare"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Pierre Fabier", email = "pierre.fabier@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pandas<3",
]

[project.scripts]
taxifare = "taxifare:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "db-dtypes>=1.9.0",
    "google-cloud-bigquery>=3.47.0",
    "google-cloud-storage>=3.17.2",
    "matplotlib>=3.11.2",
    "ipykernel>=7.4.0",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
]
